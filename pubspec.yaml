name: kingdomcome
description: Kingdom Come — A Catholic gamified faith journey app for ages 8–18.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Backend
  supabase_flutter: ^2.5.0

  # Local storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # UI / Animation
  lottie: ^3.1.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1

  # Game engine
  flame: ^1.18.0

  # Arts & crafts canvas
  flutter_painter_v2: ^2.1.0

  # Notifications
  flutter_local_notifications: ^17.2.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  dartz: ^0.10.1

  # Networking
  dio: ^5.4.3

  # Audio
  just_audio: ^0.9.38

  # Deep links
  app_links: ^6.1.1

  # Secure storage
  flutter_secure_storage: ^9.0.0

  # Timezone support (required by flutter_local_notifications for scheduling)
  timezone: ^0.9.4

  # PDF generation (printable certificates & artworks)
  pdf: ^3.10.8

  # Sharing achievements, artworks, and hymns
  share_plus: ^9.0.0

  # Color picker for Arts & Crafts editors
  flutter_colorpicker: ^1.1.0

  # File system access for PDF saving
  path_provider: ^2.1.3

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

  # Testing
  mocktail: ^1.0.4

  # Linting
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/audio/
    - assets/data/

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Regular.ttf
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cinzel-SemiBold.ttf
          weight: 600
