name = "kingdom-come-ai-gateway"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
MAGISTERIUM_API_KEY = ""
ANTHROPIC_API_KEY = ""
MODAL_API_KEY = ""
MODAL_TTS_URL = ""
MODAL_MUSIC_URL = ""
RUNWAY_API_KEY = ""
HEYGEN_API_KEY = ""
WORLD_ANVIL_API_KEY = ""
R2_ASSETS_BASE_URL = "https://assets.kingdomcomeapp.com"

[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "kingdom-come-assets"

[[rules]]
type = "ESModule"
globs = ["**/*.ts"]
